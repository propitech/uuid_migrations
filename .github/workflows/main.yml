name: Ruby

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "*"
  merge_group:
jobs:
  build:
    # Routed by the repo variable RUNNER_LABELS, the same contract every other
    # Propitech repo uses. A hardcoded ubuntu-latest is refused at dispatch once
    # the org's hosted-minute allowance is spent.
    runs-on: ${{ vars.RUNNER_LABELS != '' && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    name: Ruby 4.0
    # ruby/setup-ruby refuses to install on a self-hosted runner: it reports the
    # platform as self-hosted and tells the caller to populate RUNNER_TOOL_CACHE
    # itself. Ruby therefore comes from the fleet's runner image, which carries
    # 4.0.10. The digest is the one medusa's ruby-rails-ci.yml defaults to; bump
    # them together.
    container:
      image: ghcr.io/propitech/runner-rails-8.1@sha256:d254332f77be53912baad7db9ec9c1cb043c1f7242175343c4ce81610cfab2fa
    env:
      # The image ships gems under a root-owned system path; the runner uid
      # cannot write there, so keep the bundle inside the workspace.
      BUNDLE_PATH: vendor/bundle
      # GitHub puts the job container and its services on a per-job bridge
      # network, so Postgres answers on its service name, not on localhost.
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:16-alpine
        # No host port is published: the job container reaches the service over
        # the bridge network, and not publishing means concurrent jobs on one
        # self-hosted VM cannot collide on 5432.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uuid_migrations_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Install gems
      run: bundle install --jobs 4 --retry 3
    - name: Run the default task
      run: bundle exec rake
